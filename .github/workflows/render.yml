name: Render site

# Renders the Quarto sources and commits the resulting `docs/` back to the
# branch, so the published site can never drift from the .qmd sources.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.4.551'

      - name: Render site
        run: quarto render

      - name: Commit rendered site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "docs/ already up to date"
          else
            git commit -m "Render site [skip ci]"
            git push
          fi
